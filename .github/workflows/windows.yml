# Arma la versión de Windows y, si se corre con una etiqueta (v0.6.0…), la pone en su Release.
name: Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc -V
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            daw/target
          key: windows-${{ hashFiles('Cargo.lock', 'daw/Cargo.lock') }}
      - name: ffmpeg
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Rename-Item (Get-ChildItem ff -Directory).FullName ffmpeg
      - name: Compilar y empacar
        run: .\empaque\empacar-windows.ps1 -Ffmpeg (Resolve-Path ff\ffmpeg\bin).Path
      - name: Instalador
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path empaque\Info.plist -Pattern 'ShortVersionString</key><string>([^<]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" empaque\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item "Beethoven Craft-windows.zip" "dist\BeethovenCraft-$v-windows-portable.zip"
      - name: El DAW arranca y dibuja
        run: |
          & "dist\Beethoven Craft\beethoven-daw.exe" --screenshot dist\daw.png --view score --demo --no-rack --no-browser --size 1300x800 | Out-Default
          if (!(Test-Path dist\daw.png)) { exit 1 }
        env:
          BEETHOVEN_IDIOMA: es
      - name: Pruebas de Movie
        continue-on-error: true
        run: |
          $env:PATH = "$(Resolve-Path ff\ffmpeg\bin);$env:PATH"
          cargo test --release --lib
          cargo test --release --test edicion --test archivo --test nodos --test animacion
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/daw.png
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Beethoven Craft ${GITHUB_REF_NAME#v}" --notes "Versión de prueba."
          gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/*.zip --clobber
