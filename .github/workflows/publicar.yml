# Publica una versión: al subir una etiqueta (v0.11.0…) arma Mac, Windows y Linux y la pone en Releases con
# latest.json, que es lo que lee la app para saber si hay una versión nueva. A mano (workflow_dispatch) solo arma.
name: Publicar
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            daw/target
          key: windows-${{ hashFiles('Cargo.lock', 'daw/Cargo.lock') }}
      - name: ffmpeg
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Rename-Item (Get-ChildItem ff -Directory).FullName ffmpeg
      - name: Compilar y empacar
        run: .\empaque\empacar-windows.ps1 -Ffmpeg (Resolve-Path ff\ffmpeg\bin).Path
      - name: Instalador
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path empaque\Info.plist -Pattern 'ShortVersionString</key><string>([^<]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" empaque\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item "Beethoven Craft-windows.zip" "dist\BeethovenCraft-$v-windows-portable.zip"
      - name: El DAW arranca y dibuja
        run: |
          & "dist\Beethoven Craft\beethoven-daw.exe" --screenshot dist\daw.png --view score --demo --no-rack --no-browser --size 1300x800 | Out-Default
          if (!(Test-Path dist\daw.png)) { exit 1 }
        env:
          BEETHOVEN_IDIOMA: es
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Paquetes para compilar
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpulse-dev libjack-jackd2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - name: Rust
        run: rustup update stable --no-self-update && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            daw/target
          key: linux-${{ hashFiles('Cargo.lock', 'daw/Cargo.lock') }}
      - name: Compilar y empacar
        run: |
          sh empaque/empacar-linux.sh
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p salida && mv beethoven-craft-linux.tar.gz "salida/BeethovenCraft-$v-linux.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: salida/*.tar.gz

  mac:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup update stable --no-self-update && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            daw/target
          key: mac-${{ hashFiles('Cargo.lock', 'daw/Cargo.lock') }}
      - name: Compilar y empacar
        run: |
          zsh empaque/empacar.sh
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p salida && ditto -c -k --keepParent "Beethoven Craft.app" "salida/BeethovenCraft-$v-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: salida/*.zip

  publicar:
    needs: [windows, linux, mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'FIN'
          import hashlib, json, os, glob
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          def uno(patron):
              f = glob.glob(f"paquetes/{patron}")[0]
              b = open(f, "rb").read()
              return {"url": f"https://github.com/{repo}/releases/download/{tag}/{os.path.basename(f)}", "sha256": hashlib.sha256(b).hexdigest(), "peso": len(b)}
          notas = open("empaque/notas.md", encoding="utf-8").read()
          d = {"version": tag.lstrip("v"), "notas": notas, "mac": uno("*-mac.zip"), "windows": uno("*-instalador.exe"), "linux": uno("*-linux.tar.gz")}
          json.dump(d, open("paquetes/latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          FIN
          ls -la paquetes
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" paquetes/* --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" paquetes/* --title "Beethoven Craft ${TAG#v}" --notes-file empaque/notas.md --latest
          fi
