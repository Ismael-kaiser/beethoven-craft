[workspace]
members = ["crates/audio-fx", "crates/craft-trans"]
# Beethoven DAW es otro proyecto de Cargo y se compila aparte.
exclude = ["daw"]

[package]
name = "toma-uno"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Compositor de video y audio"

[lib]
name = "toma_uno"

[dependencies]
audio-fx = { path = "crates/audio-fx" }
craft-trans = { path = "crates/craft-trans" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu"] }
cpal = "0.18"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
realfft = "3"
tract-onnx = "0.23"
midir = "0.11"
rmp-serde = "1"
miniz_oxide = "0.8"
# Efectos de video de EffectCraft (MIT OR Apache-2.0), fijados a un commit.
effectcraft-effects = { git = "https://github.com/storytold/effectcraft.git", rev = "1738360417403d8780aa3a4949bd6f6a49b6588d" }
effectcraft-keyframe = { git = "https://github.com/storytold/effectcraft.git", rev = "1738360417403d8780aa3a4949bd6f6a49b6588d" }
effectcraft-project = { git = "https://github.com/storytold/effectcraft.git", rev = "1738360417403d8780aa3a4949bd6f6a49b6588d" }
effectcraft-raster = { git = "https://github.com/storytold/effectcraft.git", rev = "1738360417403d8780aa3a4949bd6f6a49b6588d" }
effectcraft-color = { git = "https://github.com/storytold/effectcraft.git", rev = "1738360417403d8780aa3a4949bd6f6a49b6588d" }
rayon = "1"
fontdue = "0.9"

# Linux: eframe sin sus funciones por defecto no trae con qué abrir ventanas.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }

[profile.release]
debug = false
