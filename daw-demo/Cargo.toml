# Beethoven DAW Demo: el estudio de música propio de Beethoven Craft (demo). Proyecto de Cargo aparte.
[workspace]

[package]
name = "beethoven-daw-demo"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Estudio de música con instrumentos en Lua"

[lib]
name = "beethoven_daw_demo"

[dependencies]
# Las mismas librerías y versiones que Movie.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu"] }
cpal = "0.18"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
mlua = { version = "0.11", features = ["lua54", "vendored"] }
clap-sys = "0.5"
vst3 = "0.3"
libloading = "0.8"
sys-locale = "0.3"
midir = "0.11"
ureq = "3"
getrandom = "0.3"
arboard = { version = "3", default-features = false }
# Lee las imágenes PNG que traen los efectos en su carpeta (MIT o Apache-2.0).
png = "0.18"
# Biblioteca MPL-2.0 sin cambios: su licencia no toca este código.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "adpcm", "aiff", "caf", "alac", "mkv"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSEvent", "NSScreen", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSGeometry", "objc2-core-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }

[profile.release]
debug = false
