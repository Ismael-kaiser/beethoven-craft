[package]
name = "os-session"
description = "Beethoven DAW: the session (the project and everything that plays, records, loads and saves it), with no window"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = [
    "vst3", "vst2", "export-flac", "export-mp3", "export-ogg", "midi-io", "device", "fl-native", "rpc",
    "stock-soft-clipper", "stock-fast-distortion", "stock-balance", "stock-stereo-enhancer",
    "stock-transient-processor", "stock-chorus", "stock-stereo-shaper", "stock-filter", "stock-flanger",
    "stock-phaser", "stock-peak-controller", "stock-formula-controller", "stock-vocoder", "stock-limiter",
    "stock-reverb", "stock-delay", "stock-pulp-filter", "stock-press", "stock-parametric-eq-2", "stock-drop",
    "stock-trio", "stock-citrus", "stock-smith", "stock-slicer", "stock-drum-sampler", "stock-soundfont",
]
# Hosting VST 3 and VST 2 plugins (off: CLAP and the stock plugins only).
vst3 = ["dep:os-vst3"]
vst2 = ["dep:os-vst2"]
# The export encoders (off: that format is not written).
export-flac = ["dep:flacenc"]
export-mp3 = ["dep:mp3lame-encoder"]
export-ogg = ["dep:vorbis_rs"]
# The system's MIDI ports (`midi_ports`; off: none are listed or opened).
midi-io = ["dep:midir"]
# The system's audio devices (cpal; ASIO and WASAPI on Windows, the sound server on Linux). Off: playback runs on the
# simulated device (`device::sim`), silent, and no devices are listed or recorded from.
device = ["dep:cpal", "dep:asio-sys", "dep:windows", "dep:pulseaudio"]
# FL Studio's native plugins (`os-native`; off: none are listed, and a project's play through Beethoven's recreations or
# stay silent).
fl-native = ["dep:os-native"]
# Listening for control-plane clients (`control::server`; off: `--control` and `--serve` cannot listen).
rpc = []
# The test helpers and test-mode switches (per-thread settings, test folders) for the tests of a crate built on this
# one (`os-app`'s).
test-util = []
# Stock plugins (on by default: every build offers them; leaving one out is for forks). Off: it is not listed, and
# a project's slot holding it opens as a missing plugin.
stock-soft-clipper = ["dep:beethoven-soft-clipper"]
stock-fast-distortion = ["dep:beethoven-fast-distortion"]
stock-balance = ["dep:beethoven-balance"]
stock-stereo-enhancer = ["dep:beethoven-stereo-enhancer"]
stock-transient-processor = ["dep:beethoven-transient-processor"]
stock-chorus = ["dep:beethoven-chorus"]
stock-stereo-shaper = ["dep:beethoven-stereo-shaper"]
stock-filter = ["dep:beethoven-filter"]
stock-flanger = ["dep:beethoven-flanger"]
stock-phaser = ["dep:beethoven-phaser"]
stock-peak-controller = ["dep:beethoven-peak-controller"]
stock-formula-controller = ["dep:beethoven-formula-controller"]
stock-vocoder = ["dep:beethoven-vocoder"]
stock-limiter = ["dep:beethoven-limiter"]
stock-reverb = ["dep:beethoven-reverb"]
stock-delay = ["dep:beethoven-delay"]
stock-pulp-filter = ["dep:pulp-filter"]
stock-press = ["dep:press"]
stock-parametric-eq-2 = ["dep:beethoven-parametric-eq-2"]
stock-drop = ["dep:beethoven-drop"]
stock-trio = ["dep:beethoven-3x-osc"]
stock-citrus = ["dep:citrus"]
stock-smith = ["dep:smith"]
stock-slicer = ["dep:beethoven-slicer"]
stock-drum-sampler = ["dep:beethoven-drum-sampler"]
stock-soundfont = ["dep:beethoven-soundfont"]

[dependencies]
os-model.workspace = true
os-dsp.workspace = true
os-flp.workspace = true
os-engine.workspace = true
os-hostlink.workspace = true
os-clap = { path = "../os-clap" }
os-native = { path = "../os-native", optional = true }
os-host.workspace = true
os-vst3 = { workspace = true, optional = true }
os-vst2 = { workspace = true, optional = true }
os-paths.workspace = true
beethoven-sampler = { path = "../../plugins/beethoven-sampler", default-features = false, features = ["linked"] }
beethoven-parametric-eq-2 = { path = "../../plugins/beethoven-parametric-eq-2", optional = true, default-features = false, features = ["linked"] }
beethoven-3x-osc = { path = "../../plugins/beethoven-3x-osc", optional = true, default-features = false, features = ["linked"] }
citrus = { path = "../../plugins/citrus", optional = true, default-features = false, features = ["linked"] }
smith = { path = "../../plugins/smith", optional = true, default-features = false, features = ["linked"] }
beethoven-drum-sampler = { path = "../../plugins/beethoven-drum-sampler", optional = true, default-features = false, features = ["linked"] }
beethoven-soundfont = { path = "../../plugins/beethoven-soundfont", optional = true, default-features = false, features = ["linked"] }
beethoven-limiter = { path = "../../plugins/beethoven-limiter", optional = true, default-features = false, features = ["linked"] }
beethoven-reverb = { path = "../../plugins/beethoven-reverb", optional = true, default-features = false, features = ["linked"] }
beethoven-delay = { path = "../../plugins/beethoven-delay", optional = true, default-features = false, features = ["linked"] }
beethoven-soft-clipper = { path = "../../plugins/beethoven-soft-clipper", optional = true, default-features = false, features = ["linked"] }
beethoven-fast-distortion = { path = "../../plugins/beethoven-fast-distortion", optional = true, default-features = false, features = ["linked"] }
beethoven-balance = { path = "../../plugins/beethoven-balance", optional = true, default-features = false, features = ["linked"] }
beethoven-stereo-enhancer = { path = "../../plugins/beethoven-stereo-enhancer", optional = true, default-features = false, features = ["linked"] }
beethoven-transient-processor = { path = "../../plugins/beethoven-transient-processor", optional = true, default-features = false, features = ["linked"] }
beethoven-chorus = { path = "../../plugins/beethoven-chorus", optional = true, default-features = false, features = ["linked"] }
beethoven-small-fx = { path = "../../plugins/beethoven-small-fx", default-features = false }
beethoven-stereo-shaper = { path = "../../plugins/beethoven-stereo-shaper", optional = true, default-features = false, features = ["linked"] }
beethoven-filter = { path = "../../plugins/beethoven-filter", optional = true, default-features = false, features = ["linked"] }
tesla = { path = "../../plugins/tesla", default-features = false, features = ["linked"] }
pulp-filter = { path = "../../plugins/pulp-filter", optional = true, default-features = false, features = ["linked"] }
press = { path = "../../plugins/press", optional = true, default-features = false, features = ["linked"] }
beethoven-flanger = { path = "../../plugins/beethoven-flanger", optional = true, default-features = false, features = ["linked"] }
beethoven-phaser = { path = "../../plugins/beethoven-phaser", optional = true, default-features = false, features = ["linked"] }
beethoven-peak-controller = { path = "../../plugins/beethoven-peak-controller", optional = true, default-features = false, features = ["linked"] }
beethoven-formula-controller = { path = "../../plugins/beethoven-formula-controller", optional = true, default-features = false, features = ["linked"] }
beethoven-slicer = { path = "../../plugins/beethoven-slicer", optional = true, default-features = false, features = ["linked"] }
beethoven-vocoder = { path = "../../plugins/beethoven-vocoder", optional = true, default-features = false, features = ["linked"] }
beethoven-drop = { path = "../../plugins/beethoven-drop", optional = true, default-features = false, features = ["linked"] }
cpal = { version = "0.18", optional = true }
crossbeam-queue = "0.3"
midir = { version = "0.11", optional = true }
# JPEG workspace pictures of theme files (`wallpaper`; PNG goes through tiny-skia). Pure Rust, no threads.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Export encoders (`export::encode`): FLAC (pure Rust), MP3 (LAME, built from source) and Ogg Vorbis (libvorbis, built
# from source).
flacenc = { version = "0.5", optional = true }
mp3lame-encoder = { version = "0.3", optional = true }
vorbis_rs = { version = "0.5", optional = true }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# ASIO output (`device::asio`), built from the ASIO SDK's host files in `asiosdk` (`.cargo/config.toml`).
asio-sys = { version = "0.4", optional = true }
# WASAPI exclusive and low-latency shared output (`device::wasapi`): the version cpal is built with.
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Devices_Properties", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Shared mode plays through the sound server (PulseAudio, or PipeWire's pipewire-pulse) as other programs do; the
# PulseAudio host speaks the protocol in Rust, so no system library is linked. Exclusive mode opens ALSA directly.
cpal = { version = "0.18", optional = true, features = ["pulseaudio", "jack"] }
# The cards the sound server gave up on while Beethoven DAW had them through ALSA (`device::sound_server`): the
# protocol crate cpal's PulseAudio host is built on.
pulseaudio = { version = "0.3", optional = true }
# Real-time priority for the audio threads (`rt`): rtkit on the system bus, through the zbus the file dialogs
# already bring.
libc = "0.2"
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
