[package]
name = "os-clap"
description = "Beethoven DAW's CLAP plugin host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
clap-sys = "0.5"
libloading = "0.8"
os-engine.workspace = true
os-host.workspace = true
os-hostlink.workspace = true


[dev-dependencies]
os-model.workspace = true
# The built-in EQ, linked (no exported entry points), for the parameter tests.
beethoven-parametric-eq-2 = { path = "../../plugins/beethoven-parametric-eq-2", features = ["linked"] }
# The built-in Beethoven Sampler, linked, for the portamento test.
beethoven-sampler = { path = "../../plugins/beethoven-sampler", features = ["linked"] }
# The built-in Beethoven Trio and Citrus, linked, for the note mods test.
beethoven-3x-osc = { path = "../../plugins/beethoven-3x-osc", features = ["linked"] }
citrus = { path = "../../plugins/citrus", features = ["linked"] }
# The built-in Beethoven Limiter, linked: a plugin with a sidechain input port.
beethoven-limiter = { path = "../../plugins/beethoven-limiter", features = ["linked"] }
# The built-in Beethoven Peak Controller, linked: controller outputs as MIDI.
beethoven-peak-controller = { path = "../../plugins/beethoven-peak-controller", features = ["linked"] }
# The built-in Beethoven Formula Controller, linked: a controller output worked out from the song position.
beethoven-formula-controller = { path = "../../plugins/beethoven-formula-controller", features = ["linked"] }
beethoven-small-fx = { path = "../../plugins/beethoven-small-fx" }
